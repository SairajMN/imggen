[project]
name = "imggen"
version = "0.1.0"
description = "Black-and-white chatbot UI for thumbnail generation via OpenRouter with strict cost and call limits."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
